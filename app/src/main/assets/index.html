<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cyber Words Trainer – NICCS</title>
<style>
:root{--bg:#0f1020;--card:#191b34;--accent:#7c5cff;--good:#1f9d62;--bad:#d9534f;--text:#f7f7fb;--muted:#b9bad0;--line:#2d3159}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Hebrew",sans-serif;background:linear-gradient(180deg,#0d1022,#17122c 65%,#0f1020);color:var(--text);min-height:100vh}
.wrap{max-width:720px;margin:auto;padding:18px 14px 42px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{font-size:21px;font-weight:800}.badge{background:#26294a;border:1px solid #3c4171;padding:8px 11px;border-radius:999px;color:#d9dbff;font-size:13px}
.panel{background:rgba(25,27,52,.96);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 18px 50px #0005}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:#11142b;border:1px solid #292d52;border-radius:14px;padding:10px 6px;text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--muted)}
.progress{height:9px;background:#0c0f24;border-radius:99px;overflow:hidden;margin:8px 0 22px}.progress>div{height:100%;background:linear-gradient(90deg,#6b5cff,#aa70ff);width:0}
.counter{text-align:center;color:#bfc2e6;font-size:13px}.word-row{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0 18px}
.word{font-size:38px;font-weight:900;direction:ltr;text-align:center;word-break:break-word}.icon-btn{border:1px solid #454a7c;background:#242844;color:white;border-radius:13px;width:44px;height:44px;font-size:20px;cursor:pointer}
.answers{display:grid;gap:11px}.answer{width:100%;padding:16px 13px;border-radius:16px;border:1px solid #3b406e;background:#f8f8fb;color:#262138;font-size:18px;font-weight:700;cursor:pointer;text-align:right;transition:.15s}
.answer:hover{transform:translateY(-1px)}.answer.good{background:#dff7eb;border-color:#4fbd84;color:#10663e}.answer.bad{background:#ffe5e3;border-color:#e67570;color:#8b2724}.answer.dim{opacity:.55}
.feedback{min-height:44px;margin-top:12px;font-size:15px;font-weight:700;text-align:center}.actions{display:flex;gap:9px;margin-top:10px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;padding:12px;border-radius:14px;border:1px solid #454a7c;background:#242844;color:white;font-weight:700;cursor:pointer}.btn.primary{background:#6f55e8;border-color:#806af0}
.settings{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:9px}select,label.switch{width:100%;background:#11142b;border:1px solid #30355e;color:white;border-radius:13px;padding:11px;font-size:14px}
label.switch{display:flex;align-items:center;justify-content:space-between;gap:8px}.small{font-size:12px;color:var(--muted);line-height:1.5;margin-top:15px}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;padding:14px;z-index:10}.modal.open{display:flex}
.sheet{width:min(720px,100%);max-height:82vh;overflow:auto;background:#171a33;border:1px solid #3b406e;border-radius:22px;padding:17px}.sheet h2{margin-top:0}
.list-item{display:flex;justify-content:space-between;gap:12px;padding:11px 3px;border-bottom:1px solid #2a2e53}.en{direction:ltr;text-align:left;font-weight:800}.he{text-align:right;color:#d8daf3}
.search{width:100%;padding:12px;border-radius:12px;border:1px solid #3a3f6d;background:#0f1229;color:white;font-size:16px;margin-bottom:10px}
@media(max-width:520px){.wrap{padding:12px 10px 30px}.panel{padding:14px}.stats{grid-template-columns:repeat(2,1fr)}.word{font-size:32px}.answer{font-size:17px;padding:15px 12px}.settings{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="brand">🛡️ Cyber Words Trainer</div><div class="badge">NICCS / CISA</div></div>
<div class="panel">
<div class="stats">
<div class="stat"><b id="score">0</b><span>נכונות</span></div><div class="stat"><b id="wrong">0</b><span>טעויות</span></div>
<div class="stat"><b id="streak">0</b><span>רצף</span></div><div class="stat"><b id="mastered">0</b><span>שולט בהן</span></div>
</div>
<div class="counter" id="counter"></div><div class="progress"><div id="bar"></div></div>

<label class="switch"><span>השמעה אוטומטית</span><input id="autoSpeak" type="checkbox"></label>
</div>
<div class="small">המאגר באפליקציה מבוסס על מונחי הסייבר של NICCS/CISA. ההתקדמות נשמרת בדפדפן במכשיר שלך. תשובה נכונה 3 פעמים על אותה מילה מסמנת אותה כ״שולט בה״.</div>
</div></div>

const KEY='cyber_words_trainer_v1';
let state=JSON.parse(localStorage.getItem(KEY)||'{}');
state.correct=state.correct||{};state.wrong=state.wrong||{};state.hard=state.hard||{};state.totalCorrect=state.totalCorrect||0;state.totalWrong=state.totalWrong||0;state.streak=state.streak||0;
let pool=[],current=null,locked=false,seenSession=0;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return s.toLowerCase()}
function buildPool(){
 const mode=$('mode').value;
 pool=WORDS.filter(w=>{const k=norm(w.en);if(mode==='wrong')return(state.wrong[k]||0)>0;if(mode==='hard')return!!state.hard[k];if(mode==='unmastered')return(state.correct[k]||0)<3;return true});
 if(!pool.length)pool=WORDS.slice();shuffle(pool);seenSession=0;
}
function distractorsFor(w){const others=WORDS.filter(x=>x.he!==w.he);shuffle(others);return others.slice(0,3).map(x=>x.he)}
function speak(){if(!current)return;if(window.Android&&typeof Android.speak==='function'){Android.speak(current.en);return;}if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(current.en);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}
function nextWord(){
 locked=false;$('feedback').textContent='';if(!pool.length)buildPool();current=pool.pop();seenSession++;
 $('word').textContent=current.en;$('counter').textContent=`מילה ${seenSession} מתוך ${Math.max(seenSession+pool.length,1)} · ${WORDS.length} מילים במאגר`;
 $('bar').style.width=(seenSession/Math.max(seenSession+pool.length,1)*100)+'%';$('hard').textContent=state.hard[norm(current.en)]?'⭐ מילה קשה':'☆ סמן כקשה';
 const opts=shuffle([current.he,...distractorsFor(current)]),box=$('answers');box.innerHTML='';
 opts.forEach((txt,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=`${i+1}. ${txt}`;b.dataset.val=txt;b.onclick=()=>choose(b);box.appendChild(b)});
 if($('autoSpeak').checked)setTimeout(speak,180);updateStats();
}
function choose(btn){
 if(locked)return;locked=true;const k=norm(current.en),ok=btn.dataset.val===current.he,buttons=[...document.querySelectorAll('.answer')];
 if(ok){btn.classList.add('good');state.correct[k]=(state.correct[k]||0)+1;state.totalCorrect++;state.streak++;$('feedback').textContent='✅ נכון!'}
 else{btn.classList.add('bad');state.wrong[k]=(state.wrong[k]||0)+1;state.totalWrong++;state.streak=0;buttons.find(b=>b.dataset.val===current.he)?.classList.add('good');$('feedback').textContent=`❌ התשובה הנכונה: ${current.he}`}
 buttons.forEach(b=>{if(!b.classList.contains('good')&&!b.classList.contains('bad'))b.classList.add('dim')});save();updateStats();
}
function updateStats(){$('score').textContent=state.totalCorrect;$('wrong').textContent=state.totalWrong;$('streak').textContent=state.streak;$('mastered').textContent=Object.values(state.correct).filter(n=>n>=3).length}
$('next').onclick=nextWord;$('speak').onclick=speak;
$('hard').onclick=()=>{if(!current)return;const k=norm(current.en);state.hard[k]=!state.hard[k];save();$('hard').textContent=state.hard[k]?'⭐ מילה קשה':'☆ סמן כקשה'};
$('mode').onchange=()=>{buildPool();nextWord()};
$('autoSpeak').onchange=()=>localStorage.setItem('cyber_auto_speak',$('autoSpeak').checked?'1':'0');$('autoSpeak').checked=localStorage.getItem('cyber_auto_speak')==='1';
function renderList(q=''){q=q.trim().toLowerCase();const arr=WORDS.filter(w=>!q||w.en.toLowerCase().includes(q)||w.he.includes(q));$('list').innerHTML=arr.map(w=>`<div class="list-item"><div class="he">${w.he}</div><div class="en">${w.en}</div></div>`).join('')}
$('showList').onclick=()=>{$('modal').classList.add('open');renderList()};$('close').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};$('search').oninput=e=>renderList(e.target.value);
buildPool();nextWord();
</script>
