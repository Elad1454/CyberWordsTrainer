<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cyber Words Trainer</title>
<style>
:root{
  --bg:#0d1022;--panel:#171a33;--card:#11142b;--line:#30355e;--text:#f6f7fb;--muted:#b8bad0;
  --accent:#7657f3;--good:#159a62;--bad:#d94e49;--answer:#f7f7fb;--answerText:#28253a;
  --safeTop:0px;--safeBottom:0px;--h:100dvh;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Arial,"Noto Sans Hebrew",sans-serif;color:var(--text)}
body{min-height:100dvh}
button,select{font:inherit}
.app{
  height:100%; width:100%; overflow:hidden;
  padding:clamp(6px,1.3vh,12px) clamp(8px,2vw,16px) clamp(6px,1.2vh,12px);
  display:flex; flex-direction:column; gap:clamp(6px,1vh,10px);
  background:linear-gradient(180deg,#0b0e20,#111128 55%,#0c0e1e);
}
.header{
  min-height:clamp(44px,6.2vh,58px);
  display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:8px;
  flex:0 0 auto;
}
.brand{grid-column:2;font-weight:900;font-size:clamp(19px,5vw,29px);white-space:nowrap;text-align:center;line-height:1}
.badge{justify-self:start;grid-column:3;background:#25294c;border:1px solid #414777;border-radius:999px;padding:clamp(5px,0.9vh,8px) clamp(8px,2.5vw,13px);font-size:clamp(10px,2.6vw,14px);white-space:nowrap}
.header-spacer{grid-column:1}
.screen{display:none;min-height:0;flex:1}
.screen.active{display:flex}
.home{flex-direction:column;min-height:0}
.home-card{background:rgba(23,26,51,.96);border:1px solid var(--line);border-radius:22px;padding:clamp(12px,2vh,20px);display:flex;flex-direction:column;min-height:0;flex:1}
.home h1{font-size:clamp(22px,6vw,34px);margin:0 0 6px}
.home p{margin:0 0 12px;color:var(--muted);font-size:clamp(13px,3.5vw,17px);line-height:1.4}
.categories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(8px,1.2vh,12px);overflow:auto;padding-bottom:4px}
.cat{
  min-height:clamp(76px,11vh,105px);background:#11142b;border:1px solid #343965;border-radius:18px;color:white;
  padding:12px;text-align:right;font-weight:800;font-size:clamp(14px,3.7vw,18px);display:flex;flex-direction:column;justify-content:space-between
}
.cat small{color:var(--muted);font-weight:500;font-size:clamp(10px,2.6vw,12px)}
.cat.all{grid-column:1/-1;background:linear-gradient(135deg,#4f3db2,#7657f3)}
.quiz{flex-direction:column;min-height:0}
.quiz-panel{
  flex:1;min-height:0;background:rgba(23,26,51,.97);border:1px solid var(--line);border-radius:22px;
  padding:clamp(8px,1.4vh,14px);display:grid;
  grid-template-rows:auto auto auto minmax(0,1fr) auto;gap:clamp(5px,0.85vh,9px);
}
.quiz-top{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px}
.quiz-title{font-size:clamp(12px,3vw,15px);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exit{border:1px solid #414777;background:#232744;color:white;border-radius:10px;padding:7px 10px;font-size:12px}
.progress-wrap{display:flex;align-items:center;gap:8px}
.progress-text{font-size:clamp(11px,2.8vw,13px);color:var(--muted);white-space:nowrap}
.progress{height:7px;background:#0c0f24;border-radius:999px;overflow:hidden;flex:1}
.progress>div{height:100%;background:linear-gradient(90deg,#7657f3,#a06cff);width:0}
.word-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;direction:ltr;min-height:clamp(52px,8.2vh,78px)}
.word{font-size:clamp(25px,7.2vw,43px);font-weight:900;line-height:1.02;text-align:center;word-break:break-word}
.speak{width:clamp(44px,11vw,58px);height:clamp(44px,11vw,58px);border-radius:15px;border:1px solid #454b7d;background:#252946;color:white;font-size:clamp(18px,5vw,25px)}
.answers{min-height:0;display:grid;grid-template-rows:repeat(4,minmax(0,1fr));gap:clamp(7px,1vh,10px)}
.answer{
  min-height:0;width:100%;border-radius:clamp(13px,2vh,18px);border:1px solid #d9d9e2;background:var(--answer);color:var(--answerText);
  padding:clamp(8px,1.3vh,14px) clamp(10px,2.5vw,16px);font-size:clamp(15px,4.2vw,21px);font-weight:800;text-align:right;line-height:1.15;
  display:flex;align-items:center;justify-content:flex-start;transition:.12s
}
.answer.correct{background:#dff8ea;border-color:#37b87a;color:#0f6e43}
.answer.wrong{background:#ffe2df;border-color:#e06f69;color:#8a2924}
.answer.dim{opacity:.58}
.quiz-bottom{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.feedback{
  min-height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:6px 10px;font-size:clamp(13px,3.5vw,16px);font-weight:900;
  background:#10142a;color:var(--muted)
}
.feedback.good{background:#123d2c;color:#91f0c1}.feedback.bad{background:#4a1f22;color:#ffb2ad}
.hard{border:1px solid #414777;background:#232744;color:white;border-radius:12px;padding:8px 11px;font-size:clamp(12px,3vw,14px);white-space:nowrap}
.result{flex-direction:column;min-height:0}
.result-card{flex:1;background:rgba(23,26,51,.97);border:1px solid var(--line);border-radius:22px;padding:clamp(14px,2vh,22px);display:flex;flex-direction:column;min-height:0}
.score{font-size:clamp(34px,12vw,64px);font-weight:900;text-align:center;margin:3px 0}
.result-sub{text-align:center;color:var(--muted);font-size:clamp(14px,3.8vw,18px);margin-bottom:10px}
.review{flex:1;min-height:0;overflow:auto;border-top:1px solid #2d3159;border-bottom:1px solid #2d3159;padding:7px 0}
.review-item{padding:8px 2px;border-bottom:1px solid #262b50;font-size:clamp(12px,3.3vw,15px)}
.review-item b{direction:ltr;display:inline-block}
.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.primary,.secondary{border-radius:14px;padding:12px 10px;font-weight:800}
.primary{background:#7657f3;color:white;border:0}.secondary{background:#232744;color:white;border:1px solid #414777}
.toast{
 position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);z-index:30;opacity:0;pointer-events:none;
 border-radius:18px;padding:14px 20px;font-weight:900;font-size:clamp(18px,5vw,24px);transition:.14s;background:#11142b;border:1px solid #3b406e
}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast.good{background:#0f5136;border-color:#29b778}.toast.bad{background:#6a2528;border-color:#dc625d}
@media (max-width:380px){
 .badge{font-size:9px;padding:5px 8px}.brand{font-size:18px}.quiz-panel{padding:7px}.answer{font-size:14px}.hard{padding:7px 8px}
}
@media (max-height:760px){
 .app{gap:4px;padding-top:4px;padding-bottom:4px}.header{min-height:38px}.badge{padding:4px 8px}.brand{font-size:18px}
 .quiz-panel{gap:4px;padding:7px}.word-row{min-height:46px}.word{font-size:clamp(22px,6.4vw,31px)}.speak{width:40px;height:40px}
 .answer{font-size:14px;padding:6px 9px}.feedback{min-height:30px;font-size:12px}.hard{font-size:11px;padding:6px 8px}
}
@media (max-height:650px){
 .header{display:none}.quiz-panel{border-radius:14px}.quiz-title{font-size:11px}.progress-text{font-size:10px}
 .word-row{min-height:40px}.word{font-size:22px}.answer{font-size:13px;border-radius:11px}.feedback{min-height:26px}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-spacer"></div>
    <div class="brand">Cyber Words Trainer 🛡️</div>
    <div class="badge">NICCS / CISA</div>
  </div>

  <section id="home" class="screen home active">
    <div class="home-card">
      <h1>בחר מבחן</h1>
      <p>כל מבחן כולל 10 מילים. בסיום תקבל ציון, טעויות ואפשרות לעבור מיד למבחן הבא.</p>
      <div id="categories" class="categories"></div>
    </div>
  </section>

  <section id="quiz" class="screen quiz">
    <div class="quiz-panel">
      <div class="quiz-top">
        <div id="quizTitle" class="quiz-title"></div>
        <button id="exitQuiz" class="exit">קטגוריות</button>
      </div>
      <div class="progress-wrap">
        <div id="progressText" class="progress-text"></div>
        <div class="progress"><div id="bar"></div></div>
      </div>
      <div class="word-row">
        <div id="word" class="word"></div>
        <button id="speak" class="speak">🔊</button>
      </div>
      <div id="answers" class="answers"></div>
      <div class="quiz-bottom">
        <div id="feedback" class="feedback">בחר תשובה</div>
        <button id="hard" class="hard">☆ קשה</button>
      </div>
    </div>
  </section>

  <section id="result" class="screen result">
    <div class="result-card">
      <div id="score" class="score">0/10</div>
      <div id="resultSub" class="result-sub"></div>
      <div id="review" class="review"></div>
      <div class="result-actions">
        <button id="nextExam" class="primary">המבחן הבא</button>
        <button id="backHome" class="secondary">קטגוריות</button>
      </div>
    </div>
  </section>
</div>
<div id="toast" class="toast"></div>

מידע המאפשר זיהוי אישי","cat":"IT & Network"},{"en":"plaintext","he":"טקסט גלוי / לא מוצפן","cat":"Crypto & Data Protection"},{"en":"precursor","he":"סימן מקדים לאירוע","cat":"IT & Network"},{"en":"preparedness","he":"מוכנות","cat":"SOC / Incident Response"},{"en":"privacy","he":"פרטיות","cat":"CISO Core"},{"en":"ransomware","he":"כופרה","cat":"Malware & Attacks"},{"en":"recovery","he":"התאוששות","cat":"SOC / Incident Response"},{"en":"red team","he":"צוות תקיפה","cat":"IT & Network"},{"en":"resilience","he":"חוסן","cat":"CISO Core"},{"en":"risk","he":"סיכון","cat":"CISO Core"},{"en":"risk assessment","he":"הערכת סיכונים","cat":"CISO Core"},{"en":"risk management","he":"ניהול סיכונים","cat":"CISO Core"},{"en":"risk mitigation","he":"הפחתת סיכון","cat":"CISO Core"},{"en":"rootkit","he":"ערכת כלים להסתרת שליטה במערכת","cat":"Malware & Attacks"},{"en":"RTOS","he":"מערכת הפעלה בזמן אמת","cat":"OT / ICS"},{"en":"scareware","he":"תוכנה שמפחידה את המשתמש","cat":"Malware & Attacks"},{"en":"SECaaS","he":"אבטחה כשירות","cat":"Cloud / AppSec"},{"en":"SecDevOps","he":"פיתוח מאובטח משולב בתפעול","cat":"Cloud / AppSec"},{"en":"SecOps","he":"אבטחה ותפעול משולבים","cat":"IT & Network"},{"en":"secret key","he":"מפתח סודי","cat":"Crypto & Data Protection"},{"en":"securely provision","he":"הקמה ואספקה מאובטחת","cat":"Cloud / AppSec"},{"en":"security automation","he":"אוטומציה באבטחה","cat":"IT & Network"},{"en":"security incident","he":"אירוע אבטחה","cat":"SOC / Incident Response"},{"en":"security policy","he":"מדיניות אבטחה","cat":"CISO Core"},{"en":"security program management","he":"ניהול תוכנית אבטחה","cat":"IT & Network"},{"en":"SIEM","he":"ניהול מידע ואירועי אבטחה","cat":"SOC / Incident Response"},{"en":"signature","he":"חתימה / תבנית זיהוי","cat":"IT & Network"},{"en":"situational awareness","he":"מודעות מצבית","cat":"SOC / Incident Response"},{"en":"Slowloris","he":"מתקפת מניעת שירות עם בקשות HTTP חלקיות","cat":"Malware & Attacks"},{"en":"smishing","he":"דיוג באמצעות SMS","cat":"Malware & Attacks"},{"en":"SOC","he":"מרכז תפעול אבטחה","cat":"SOC / Incident Response"},{"en":"social engineering","he":"הנדסה חברתית","cat":"IT & Network"},{"en":"segregation of duties","he":"הפרדת תפקידים","cat":"CISO Core"},{"en":"software assurance","he":"הבטחת תוכנה","cat":"Cloud / AppSec"},{"en":"spam","he":"דואר זבל","cat":"IT & Network"},{"en":"subject","he":"ישות פעילה המבצעת פעולה","cat":"Identity & Access"},{"en":"supervisory control and data acquisition","he":"בקרה ופיקוח ואיסוף נתונים (SCADA)","cat":"OT / ICS"},{"en":"supply chain","he":"שרשרת אספקה","cat":"CISO Core"},{"en":"threat","he":"איום","cat":"CISO Core"},{"en":"threat agent","he":"גורם איום","cat":"CISO Core"},{"en":"threatscape","he":"נוף האיומים","cat":"CISO Core"},{"en":"threatware","he":"שם כללי לתוכנה זדונית","cat":"CISO Core"},{"en":"ticket","he":"כרטיס אימות / הרשאה","cat":"IT & Network"},{"en":"timestomping","he":"שינוי חותמות זמן להסתרת פעילות","cat":"IT & Network"},{"en":"traffic light protocol","he":"פרוטוקול רמזור לשיתוף מידע","cat":"IT & Network"},{"en":"trojan","he":"סוס טרויאני","cat":"Malware & Attacks"},{"en":"trojan horse","he":"סוס טרויאני","cat":"Malware & Attacks"},{"en":"typosquatting","he":"התחזות לדומיין באמצעות שגיאת כתיב","cat":"Malware & Attacks"},{"en":"vishing","he":"דיוג קולי","cat":"Malware & Attacks"},{"en":"vulnerability","he":"חולשה","cat":"CISO Core"},{"en":"vulnerability assessment","he":"הערכת חולשות","cat":"CISO Core"},{"en":"wardriving","he":"איתור רשתות אלחוטיות תוך כדי תנועה","cat":"IT & Network"},{"en":"wargaming","he":"תרגול תרחישי סייבר","cat":"SOC / Incident Response"},{"en":"weakness","he":"חולשה / ליקוי","cat":"CISO Core"},{"en":"weaponization","he":"הפיכת יכולת לכלי תקיפה","cat":"IT & Network"},{"en":"weaponize","he":"להפוך ניצול חולשה לכלי תקיפה","cat":"IT & Network"},{"en":"white team","he":"צוות בקרה בתרגיל","cat":"IT & Network"},{"en":"whitebox","he":"בדיקת קופסה לבנה","cat":"IT & Network"},{"en":"work factor","he":"הערכת המאמץ להתגבר על הגנה","cat":"IT & Network"},{"en":"worm","he":"תולעת מחשב","cat":"Malware & Attacks"},{"en":"XaaS","he":"הכול כשירות","cat":"Cloud / AppSec"},{"en":"zero trust","he":"אפס אמון","cat":"IT & Network"},{"en":"zero-day","he":"חולשת יום אפס","cat":"IT & Network"}];

const CATEGORIES = [
 {id:'all',name:'כל נושאי CISO',desc:'מבחן מעורב מכל המאגר'},
 {id:'CISO Core',name:'CISO Core',desc:'סיכונים, נכסים, מדיניות, CIA'},
 {id:'OT / ICS',name:'OT / ICS',desc:'SCADA, IIoT, תשתיות קריטיות והגנת OT'},
 {id:'IT & Network',name:'IT & Network',desc:'רשתות, תחנות קצה ותשתיות IT'},
 {id:'Identity & Access',name:'Identity & Access',desc:'אימות, הרשאות ו-IAM'},
 {id:'SOC / Incident Response',name:'SOC / Incident Response',desc:'SIEM, אירועים, פורנזיקה ותגובה'},
 {id:'Malware & Attacks',name:'Malware & Attacks',desc:'דיוג, כופרה, נוזקות ותקיפות'},
 {id:'Cloud / AppSec',name:'Cloud / AppSec',desc:'DevSecOps, ענן ואבטחת תוכנה'},
 {id:'Crypto & Data Protection',name:'Crypto & Data',desc:'הצפנה, Hash, מפתחות והגנת מידע'}
];

const OT_EXTRA = new Set(["IIoT","RTOS","access control","access control mechanism","asset","availability","confidentiality","critical infrastructure","cyber incident","cyber incident response plan","cybersecurity","endpoint","firewall","hardening","impact","incident","incident response","integrity","network resilience","risk","risk assessment","risk management","security incident","security policy","situational awareness","supervisory control and data acquisition","threat","vulnerability","vulnerability assessment"]);

const KEY='cyber_trainer_v3';
let state=JSON.parse(localStorage.getItem(KEY)||'{}');
state.hard=state.hard||{};
state.used=state.used||{};
state.examNo=state.examNo||{};
let currentCategory='all', exam=[], qi=0, correct=0, locked=false, review=[];

const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const key=w=>w.en.toLowerCase();
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}
function poolFor(cat){
 if(cat==='all') return WORDS.slice();
 if(cat==='OT / ICS') return WORDS.filter(w=>w.cat==='OT / ICS'||OT_EXTRA.has(w.en));
 return WORDS.filter(w=>w.cat===cat);
}
function categoryCount(cat){return poolFor(cat).length}
function renderCategories(){
 $('categories').innerHTML='';
 CATEGORIES.forEach((c,i)=>{
   const b=document.createElement('button');b.className='cat'+(i===0?' all':'');
   b.innerHTML=`<span>${c.name}</span><small>${c.desc} · ${categoryCount(c.id)} מילים</small>`;
   b.onclick=()=>startExam(c.id);
   $('categories').appendChild(b);
 });
}
function chooseTen(cat){
 let pool=poolFor(cat);
 let used=state.used[cat]||[];
 let available=pool.filter(w=>!used.includes(key(w)));
 if(available.length<10){used=[];available=pool.slice()}
 const chosen=shuffle(available).slice(0,Math.min(10,available.length));
 state.used[cat]=used.concat(chosen.map(key));
 state.examNo[cat]=(state.examNo[cat]||0)+1;
 save(); return chosen;
}
function startExam(cat){
 currentCategory=cat;exam=chooseTen(cat);qi=0;correct=0;review=[];locked=false;
 $('quizTitle').textContent=(CATEGORIES.find(c=>c.id===cat)?.name||cat)+' · מבחן '+state.examNo[cat];
 show('quiz');renderQuestion();
}
function distractors(w){
 let same=poolFor(currentCategory).filter(x=>x.he!==w.he);
 if(same.length<3) same=WORDS.filter(x=>x.he!==w.he);
 return shuffle(same).slice(0,3).map(x=>x.he);
}
function renderQuestion(){
 locked=false;$('feedback').className='feedback';$('feedback').textContent='בחר תשובה';
 const w=exam[qi];
 $('word').textContent=w.en;
 $('progressText').textContent=`${qi+1} / ${exam.length}`;
 $('bar').style.width=((qi)/exam.length*100)+'%';
 $('hard').textContent=state.hard[key(w)]?'★ קשה':'☆ קשה';
 const opts=shuffle([w.he,...distractors(w)]);
 const box=$('answers');box.innerHTML='';
 opts.forEach((txt,i)=>{
   const b=document.createElement('button');b.className='answer';b.dataset.val=txt;b.textContent=`${i+1}. ${txt}`;
   b.onclick=()=>answer(b);box.appendChild(b);
 });
}
function toast(text,good){
 const t=$('toast');t.textContent=text;t.className='toast show '+(good?'good':'bad');
 setTimeout(()=>t.className='toast',720);
}
function answer(btn){
 if(locked)return;locked=true;
 const w=exam[qi], ok=btn.dataset.val===w.he;
 const buttons=[...document.querySelectorAll('.answer')];
 if(ok){correct++;btn.classList.add('correct');$('feedback').className='feedback good';$('feedback').textContent='✅ נכון';toast('✅ נכון',true)}
 else{
   btn.classList.add('wrong');
   buttons.find(b=>b.dataset.val===w.he)?.classList.add('correct');
   $('feedback').className='feedback bad';$('feedback').textContent='❌ שגוי · '+w.he;toast('❌ שגוי',false)
 }
 buttons.forEach(b=>{b.disabled=true;if(!b.classList.contains('correct')&&!b.classList.contains('wrong'))b.classList.add('dim')});
 review.push({en:w.en,correct:ok,right:w.he,chosen:btn.dataset.val});
 $('bar').style.width=((qi+1)/exam.length*100)+'%';
 setTimeout(()=>{qi++; if(qi>=exam.length) finishExam(); else renderQuestion()},850);
}
function finishExam(){
 show('result');
 $('score').textContent=`${correct}/${exam.length}`;
 $('resultSub').textContent=correct===exam.length?'מצוין! 100%':correct>=8?'מעולה — ממשיכים לתרגל':correct>=6?'טוב — עוד סיבוב יחזק את המילים':'כדאי לעשות עוד מבחן בקטגוריה הזאת';
 const wrong=review.filter(r=>!r.correct);
 $('review').innerHTML=wrong.length?wrong.map(r=>`<div class="review-item">❌ <b>${r.en}</b> — ${r.right}<br><span style="color:#aeb1ca">בחרת: ${r.chosen}</span></div>`).join(''):'<div class="review-item">✅ אין טעויות במבחן הזה.</div>';
}
function speak(){
 const w=exam[qi]; if(!w)return;
 if(window.Android&&Android.speak) Android.speak(w.en);
 else if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w.en);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}
}
$('speak').onclick=speak;
$('hard').onclick=()=>{const w=exam[qi];if(!w)return;state.hard[key(w)]=!state.hard[key(w)];save();$('hard').textContent=state.hard[key(w)]?'★ קשה':'☆ קשה'};
$('exitQuiz').onclick=()=>show('home');
$('backHome').onclick=()=>show('home');
$('nextExam').onclick=()=>startExam(currentCategory);

function fit(){
 const h=window.visualViewport?window.visualViewport.height:window.innerHeight;
 const w=window.visualViewport?window.visualViewport.width:window.innerWidth;
 document.documentElement.style.setProperty('--h',h+'px');
 document.body.style.height=h+'px';
 document.documentElement.dataset.short=h<720?'1':'0';
 document.documentElement.dataset.narrow=w<360?'1':'0';
}
window.addEventListener('resize',fit);
if(window.visualViewport)window.visualViewport.addEventListener('resize',fit);
fit();renderCategories();
</script>
</body></html>
