<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#101426;color:#f4f6ff;font:17px Arial,sans-serif}main{max-width:650px;margin:auto;padding:16px}header{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:21px;margin:0}small{color:#aab5d2}button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px;background:#293451;color:white}section{background:#191f36;border:1px solid #35405e;border-radius:22px;padding:16px;margin-top:14px}.stats{display:flex;justify-content:space-between;color:#bac7e5;font-size:14px}.track{height:7px;background:#303a55;border-radius:10px;margin:12px 0;overflow:hidden}#bar{height:100%;background:#67d6bb}.word{display:flex;align-items:center;gap:12px;margin:18px 0}#term{flex:1;text-align:center;font-size:clamp(24px,6vw,38px);overflow-wrap:anywhere;font-weight:bold}.answers{display:grid;gap:10px}.answer{background:#f4f5fb;color:#171c31;text-align:right;min-height:74px;font-weight:bold;line-height:1.4}.answer.good{background:#b8f4d5;color:#10472d}.answer.bad{background:#ffc8c8;color:#702222}#feedback{line-height:1.5;margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}#next{background:#087f70}#library div{padding:12px 0;border-bottom:1px solid #35405e}input{width:100%;padding:12px;font:inherit;border-radius:12px;border:0;margin:10px 0}select{font:inherit;background:#293451;color:white;border:0;border-radius:10px;padding:10px;max-width:100%}[hidden]{display:none!important}
</style><main><header><h1>🛡 CISM Keywords Trainer</h1><button id="lib">מילון</button></header><small>תרגול מונחים מתוך דף המילים שלך</small><section id="quiz"><div class="stats"><span id="count"></span><span id="score"></span></div><div class="track"><div id="bar"></div></div><div class="word"><button id="speak" aria-label="השמעת המונח">🔊</button><div id="term" dir="ltr"></div></div><div class="answers" id="answers"></div><div id="feedback" aria-live="polite"></div><div class="actions"><button id="hard">☆ קשה</button><button id="next" disabled>הבא</button></div></section><section id="finish" hidden></section><section><select id="mode"><option value="10">מבחן 10 מילים</option><option value="20">מבחן 20 מילים</option><option value="all">כל המילים</option><option value="hard">מילים קשות</option></select> <button id="start">מבחן חדש</button><p><small id="total"></small></p></section><section id="library" hidden><input id="search" placeholder="חיפוש בעברית או באנגלית"><div id="entries"></div></section></main><script>
const data=[["FIRST","הפעולה הראשונה או בעדיפות ראשונה"],["BEST / MOST appropriate","ההחלטה הניהולית הטובה ביותר"],["LEAST","מה שיש להימנע ממנו או בעדיפות הנמוכה ביותר"],["EXCEPT / NOT","סייג שלילי: למעט או לא"],["Immediately","מיידית, מציין דחיפות"],["Before / prior to","לפני, מציין סדר פעולות"],["After / following","אחרי, מציין המשך ברצף"],["Business objectives / alignment","התאמת האבטחה ליעדים העסקיים"],["Board / senior management","פיקוח אסטרטגי של הדירקטוריון או ההנהלה הבכירה"],["Executive reporting","דיווח להנהלה"],["Accountability","אחריותיות: מי נושא באחריות לתוצאה"],["Governance","ממשל: הכוונה, פיקוח ואחריותיות"],["Policy","מדיניות מחייבת ברמה גבוהה"],["Standard","דרישות מוגדרות ומחייבות"],["Procedure","נוהל עם הוראות שלב אחר שלב"],["Guideline","הנחיה מומלצת וגמישה"],["Risk appetite","רמת הסיכון הכוללת שהארגון מוכן לקחת"],["Risk tolerance","סטייה או סף סיכון מקובל"],["Inherent risk","סיכון לפני יישום בקרות"],["Residual risk","סיכון שנותר לאחר בקרות או טיפול"],["Risk owner","בעל הסיכון הנושא באחריות"],["Risk acceptance","החלטה לקבל את הסיכון"],["Risk treatment","אפשרויות לטיפול בסיכון"],["Risk transfer","העברת היבטים כספיים או חוזיים של הסיכון"],["Risk assessment","הערכת הסתברות, השפעה והקשר של סיכון"],["Risk-based","תעדוף לפי הסתברות, השפעה והקשר"],["Cost-benefit","השוואת עלות הבקרה לתועלת"],["Risk register","מרשם סיכונים וניהולם"],["KPI","מדד ביצוע מרכזי"],["KRI","מדד סיכון מרכזי"],["Metric / measurement","מדידה המספקת עדות לביצועים או לסיכון"],["Maturity","בשלות של יכולת או תהליך"],["Effectiveness","אפקטיביות: השגת התוצאות הרצויות"],["Efficiency","יעילות: יחס משאבים לתפוקה"],["Awareness","מודעות, התנהגות אנושית ותרבות אבטחה"],["Training completion","מדד השלמת הדרכה או פעילות"],["Third party / vendor","סיכון תלות בספק חיצוני"],["Due diligence","בדיקת נאותות לפני התקשרות"],["Contract / SLA","דרישות שירות ואבטחה מוסכמות רשמית"],["Cloud shared responsibility","חלוקת אחריות בין ספק הענן ללקוח"],["Compliance","עמידה בדרישות חוקיות, רגולטוריות וחוזיות"],["Audit","ביקורת והערכה עצמאית"],["Control","אמצעי לניהול סיכון"],["Preventive","בקרה מונעת לפני אירוע"],["Detective","בקרה מגלה אירוע או כשל"],["Corrective","בקרה מתקנת לאחר בעיה"],["Compensating control","בקרה מפצה כאשר הבקרה העיקרית אינה זמינה"],["Incident","אירוע בעל השפעת אבטחה המחייב תגובה"],["Incident response","טיפול מובנה באירוע אבטחה"],["Containment","הכלה והגבלת התפשטות או נזק"],["Eradication","סילוק הגורם או שרידי התוקף"],["Recovery","שחזור פעילות עסקית בטוחה"],["Lessons learned / post-incident","הפקת לקחים ושיפור לאחר אירוע"],["Root cause","גורם השורש"],["Evidence / chain of custody","שמירת שלמות הראיות ושרשרת המשמורת"],["Escalation","הסלמה לגורם בעל סמכות מתאימה"],["Notification","יידוע בעלי העניין הנדרשים"],["Crisis management","ניהול ותיאום משבר אסטרטגי כלל ארגוני"],["BCP","תוכנית המשכיות עסקית בזמן שיבוש"],["DRP","תוכנית התאוששות מערכות ושירותי IT"],["RTO","יעד זמן התאוששות"],["RPO","יעד נקודת התאוששות או אובדן נתונים מקובל"],["BIA","ניתוח השפעה עסקית"],["Backup","עותקי נתונים ומערכות הניתנים לשחזור"],["Tabletop exercise","תרגיל שולחני מבוסס דיון בתרחיש"],["PIR / post-incident review","סקירה לאחר אירוע"],["Authorization","הרשאה או אישור מגורם מוסמך"],["Segregation of duties","הפרדת תפקידים ואחריות מתנגשת"],["Least privilege","מינימום הרשאות נדרשות"],["Zero Trust","אימות מפורש והרשאות מינימליות"],["Change management","ניהול שינויים מבוקר"],["Exception","חריגה מאושרת"],["Threshold","סף להפעלת פעולה או דיווח"],["Trend","מגמה או שינוי לאורך זמן"],["Root cause vs symptom","גורם שורש לעומת תסמין גלוי"],["Human factor","הגורם האנושי, שימושיות ותרבות"],["Privacy","פרטיות: סיכונים וחובות הנוגעים למידע אישי"],["Data classification","סיווג מידע לפי רגישות וערך"],["Data owner","בעל המידע הנושא באחריות עסקית"],["Custodian","אחראי לטיפול התפעולי במידע או בנכסים"],["Asset inventory","מצאי נכסים וזיהוי בעלות"],["Scope","גבולות והיקף התוכנית, ההערכה או הביקורת"],["Prioritize","תעדוף עבודה לפי חשיבות וסיכון"],["Communication","תקשורת ותיאום עם בעלי עניין"]];const $=id=>document.getElementById(id);let queue=[],i=0,score=0,locked=false,wrong=[];let hard=[];try{hard=JSON.parse(localStorage.getItem('hard')||'[]')}catch(e){};function shuffle(a){a=a.slice();for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}function speak(t){if(window.Android)Android.speak(t);else if(window.speechSynthesis){let u=new SpeechSynthesisUtterance(t);u.lang='en-US';speechSynthesis.speak(u)}}function start(){let m=$('mode').value;let pool=m==='hard'?data.filter(x=>hard.includes(x[0])):data;if(!pool.length){alert('אין עדיין מילים קשות');return}queue=shuffle(pool).slice(0,m==='all'||m==='hard'?pool.length:Number(m));i=score=0;wrong=[];$('quiz').hidden=false;$('finish').hidden=true;$('library').hidden=true;show()}function show(){locked=false;let q=queue[i];$('term').textContent=q[0];$('count').textContent='שאלה '+(i+1)+' מתוך '+queue.length;$('score').textContent='נכון: '+score;$('bar').style.width=(i/queue.length*100)+'%';$('feedback').textContent='';$('next').disabled=true;$('hard').textContent=hard.includes(q[0])?'★ קשה':'☆ קשה';$('answers').replaceChildren();shuffle([q,...shuffle(data.filter(x=>x!==q)).slice(0,3)]).forEach((x,n)=>{let btn=document.createElement('button');btn.className='answer';btn.textContent=(n+1)+'. '+x[1];btn.onclick=()=>{if(locked)return;locked=true;let ok=x===q;if(ok)score++;else{wrong.push(q);btn.classList.add('bad')}for(let el of $('answers').children){el.disabled=true;if(el.textContent.slice(3)===q[1])el.classList.add('good')}$('feedback').textContent=(ok?'✓ נכון! ':'✕ התשובה הנכונה: ')+q[1];$('score').textContent='נכון: '+score;$('next').disabled=false;$('bar').style.width=((i+1)/queue.length*100)+'%'};$('answers').append(btn)})} $('next').onclick=()=>{if(!locked)return;if(++i<queue.length)show();else{$('quiz').hidden=true;$('finish').hidden=false;$('finish').replaceChildren();let h=document.createElement('h2');h.textContent='סיימת! '+Math.round(score/queue.length*100)+'%';$('finish').append(h);let p=document.createElement('p');p.textContent=score+' תשובות נכונות מתוך '+queue.length;$('finish').append(p);wrong.forEach(q=>{let p=document.createElement('p');p.textContent=q[0]+' — '+q[1];$('finish').append(p)});if(wrong.length){let b=document.createElement('button');b.textContent='תרגול טעויות';b.onclick=()=>{queue=shuffle(wrong);wrong=[];i=score=0;$('finish').hidden=true;$('quiz').hidden=false;show()};$('finish').append(b)}}};$('speak').onclick=()=>speak(queue[i][0]);$('hard').onclick=()=>{let t=queue[i][0];hard=hard.includes(t)?hard.filter(x=>x!==t):[...hard,t];try{localStorage.setItem('hard',JSON.stringify(hard))}catch(e){}$('hard').textContent=hard.includes(t)?'★ קשה':'☆ קשה'};$('start').onclick=start;$('lib').onclick=()=>{$('library').hidden=!$('library').hidden;if(!$('library').hidden){render();$('library').scrollIntoView()}};function render(){let s=$('search').value.toLowerCase();$('entries').replaceChildren();data.filter(q=>q.join(' ').toLowerCase().includes(s)).forEach(q=>{let d=document.createElement('div'),b=document.createElement('button');b.textContent='🔊';b.onclick=()=>speak(q[0]);d.append(b,document.createTextNode(' '+q[0]+' — '+q[1]));$('entries').append(d)})}$('search').oninput=render;$('total').textContent=data.length+' מונחים במאגר';start();
</script>
